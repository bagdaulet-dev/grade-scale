name: grade-scale
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-grade_scale}
      MYSQL_USER: ${MYSQL_USER:-grade_scale}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Copy .env.example to .env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a local database root password}
    volumes:
      - grade-data:/var/lib/mysql
    command: ["--innodb-buffer-pool-size=64M", "--max-connections=40", "--performance-schema=OFF"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: "no"
  app:
    build: .
    image: grade-scale:local
    ports: ["127.0.0.1:8081:8081"]
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-grade_scale}
      MYSQL_USER: ${MYSQL_USER:-grade_scale}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a local database password}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081; printf 'GET /api/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r line <&3; [[ $$line == *' 200 '* ]]"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: "no"
volumes:
  grade-data:
