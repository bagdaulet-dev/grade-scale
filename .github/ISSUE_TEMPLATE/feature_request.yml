name: Feature request
description: Suggest a focused improvement to the course workspace.
body:
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include a concrete example and how you would verify it.
    validations:
      required: true
