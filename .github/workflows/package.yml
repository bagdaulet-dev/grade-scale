name: Export Docker image manually
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and export image
        run: |
          docker build -t grade-scale:${{ github.sha }} .
          docker save grade-scale:${{ github.sha }} | gzip > grade-scale-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grade-scale-docker-image
          path: grade-scale-image.tar.gz
          retention-days: 7
