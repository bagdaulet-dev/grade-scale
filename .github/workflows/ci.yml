name: Verify Grade_scale
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grade-scale-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: grade_scale
          MYSQL_USER: grade_scale
          MYSQL_PASSWORD: ci-grade-scale-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: grade_scale
      MYSQL_USER: grade_scale
      MYSQL_PASSWORD: ci-grade-scale-password
      TEST_STORAGE: mysql
      BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify the native preview repository
        env:
          TEST_STORAGE: preview
        run: ./mvnw -B -ntp clean fmt:check test
      - name: Verify MySQL and report combined coverage
        run: ./mvnw -B -ntp verify
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: python3 scripts/check-openapi.py
      - run: python3 scripts/audit-maven.py
      - run: npm run format:check
      - run: node --check src/main/resources/static/app.js
      - name: Start the application with MySQL
        run: |
          java -Xms32m -Xmx192m -jar target/grade-scale.jar --spring.profiles.active=mysql > /tmp/grade-scale.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8081/api/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/grade-scale.log
          exit 1
      - run: npm run test:browser
      - name: Build the container
        run: docker build -t grade-scale:ci .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification
          path: |
            target/surefire-reports
            target/site/jacoco
            target/dependency-audit.json
            docs/screenshots

  publish:
    name: Publish verified Docker image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set immutable image tag
        id: image
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
