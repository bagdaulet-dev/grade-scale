spring.application.name=Grade_scale
spring.profiles.default=preview
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8081}
server.servlet.session.timeout=24h
server.servlet.session.cookie.name=GRADE_SCALE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SECURE_COOKIES:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=8KB
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
logging.level.root=WARN
logging.level.dev.bagdaulet.gradescale=INFO
debug=false
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=10s
server.tomcat.threads.max=40
server.tomcat.max-connections=200
